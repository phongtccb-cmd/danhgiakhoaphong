<!-- GIAO DIEN TAI KHOAN CA NHAN -->
<div id="view-account" class="view-section">
  <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-5 shadow-sm">
    <div class="flex items-center justify-between gap-4">
      <div class="min-w-0">
        <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Tài khoản</p>
        <h1 class="text-[20px] font-black text-slate-900 tracking-tight">Thông tin cá nhân</h1>
      </div>
      <div class="w-11 h-11 rounded-2xl bg-green-50 text-green-600 border border-green-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-[24px]">manage_accounts</span>
      </div>
    </div>
  </header>

  <div class="account-shell px-4 md:px-8 py-6">
    <section class="account-panel">
      <div class="account-profile">
        <div class="account-avatar">
          <span class="material-symbols-outlined">shield_person</span>
        </div>
        <div class="min-w-0">
          <p class="account-name" id="account-name">--</p>
          <p class="account-meta" id="account-username">--</p>
        </div>
      </div>

      <div class="account-info-grid">
        <div class="account-info-box">
          <span>Vai trò đang dùng</span>
          <strong id="account-role">--</strong>
        </div>
        <div class="account-info-box">
          <span>Phạm vi khoa</span>
          <strong id="account-scope">--</strong>
        </div>
        <div class="account-info-box">
          <span>Phiên đăng nhập</span>
          <strong id="account-session">Đang hoạt động</strong>
        </div>
      </div>
    </section>

    <section class="account-panel">
      <div class="account-section-head">
        <div>
          <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Bảo mật</p>
          <h2 class="text-[17px] font-black text-slate-900 mt-1">Đổi mật khẩu</h2>
        </div>
        <span class="material-symbols-outlined account-head-icon">lock_reset</span>
      </div>

      <div class="account-form">
        <label class="account-label" for="account-current-password">Mật khẩu hiện tại</label>
        <input id="account-current-password" type="password" class="account-input" autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại">

        <label class="account-label" for="account-new-password">Mật khẩu mới</label>
        <input id="account-new-password" type="password" class="account-input" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">

        <label class="account-label" for="account-confirm-password">Xác nhận mật khẩu mới</label>
        <input id="account-confirm-password" type="password" class="account-input" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">

        <button type="button" onclick="submitAccountPasswordChange()" id="btn-account-change-password" class="account-submit">
          <span class="material-symbols-outlined text-[18px]">save</span>
          Cập nhật mật khẩu
        </button>
      </div>
    </section>
  </div>

  <style>
    .account-shell {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 520px);
      gap: 16px;
      align-items: start;
    }
    .account-panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      padding: 18px;
      min-width: 0;
    }
    .account-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .account-avatar {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .account-avatar span {
      font-size: 30px;
    }
    .account-name {
      color: #0f172a;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-meta {
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-info-grid {
      display: grid;
      gap: 10px;
    }
    .account-info-box {
      border: 1px solid #eef2f7;
      border-radius: 13px;
      padding: 12px;
      background: #f8fafc;
      min-width: 0;
    }
    .account-info-box span,
    .account-label {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 6px;
    }
    .account-info-box strong {
      color: #0f172a;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.4;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .account-head-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }
    .account-form {
      display: grid;
      gap: 9px;
    }
    .account-input {
      width: 100%;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 13px;
      padding: 12px 13px;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      transition: all 0.2s ease;
    }
    .account-input:focus {
      border-color: #16a34a;
      background: white;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.08);
    }
    .account-submit {
      margin-top: 8px;
      height: 46px;
      border-radius: 13px;
      background: #0f172a;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 900;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .account-submit:hover {
      background: #15803d;
    }
    .account-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    @media (max-width: 1023px) {
      .account-shell {
        grid-template-columns: 1fr;
      }
    }
  </style>

  
</div>
