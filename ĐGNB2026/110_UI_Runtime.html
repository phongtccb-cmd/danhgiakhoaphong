<!-- Shared client runtime for the Apps Script web application. -->
<script>
  (() => {
    const app = window.App = window.App || {};
    const loadedScripts = new Map();
    const viewRegistry = new Map();
    const eventTarget = document.createDocumentFragment();
    let activeViewId = '';

    app.state = app.state || {};

    app.utils = Object.assign(app.utils || {}, {
      escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      },

      normalizeText(value) {
        return String(value === null || value === undefined ? '' : value)
          .trim()
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/\u0111/g, 'd');
      },

      unique(values) {
        const seen = new Set();
        return (Array.isArray(values) ? values : []).filter(value => {
          const key = String(value === null || value === undefined ? '' : value).trim();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      },

      loadScriptOnce(url, globalName) {
        if (globalName && window[globalName]) return Promise.resolve(window[globalName]);
        if (loadedScripts.has(url)) return loadedScripts.get(url);

        const promise = new Promise((resolve, reject) => {
          const existing = document.querySelector(`script[data-runtime-src="${url}"]`);
          if (existing) {
            existing.addEventListener('load', () => resolve(globalName ? window[globalName] : true), { once: true });
            existing.addEventListener('error', () => reject(new Error(`Kh\u00f4ng t\u1ea3i \u0111\u01b0\u1ee3c th\u01b0 vi\u1ec7n: ${url}`)), { once: true });
            return;
          }

          const script = document.createElement('script');
          script.src = url;
          script.async = true;
          script.dataset.runtimeSrc = url;
          script.onload = () => resolve(globalName ? window[globalName] : true);
          script.onerror = () => {
            loadedScripts.delete(url);
            reject(new Error(`Kh\u00f4ng t\u1ea3i \u0111\u01b0\u1ee3c th\u01b0 vi\u1ec7n: ${url}`));
          };
          document.head.appendChild(script);
        });

        loadedScripts.set(url, promise);
        return promise;
      }
    });

    app.api = Object.assign(app.api || {}, {
      call(method, ...args) {
        return new Promise((resolve, reject) => {
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            reject(new Error('Kh\u00f4ng k\u1ebft n\u1ed1i \u0111\u01b0\u1ee3c Apps Script.'));
            return;
          }

          const runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
          runner[method](...args);
        });
      }
    });

    app.events = Object.assign(app.events || {}, {
      on(name, handler) {
        eventTarget.addEventListener(name, handler);
        return () => eventTarget.removeEventListener(name, handler);
      },

      emit(name, detail) {
        eventTarget.dispatchEvent(new CustomEvent(name, { detail }));
      }
    });

    app.views = Object.assign(app.views || {}, {
      register(viewId, controller) {
        viewRegistry.set(viewId, controller || {});
      },

      activate(viewId) {
        const previous = viewRegistry.get(activeViewId);
        if (activeViewId && activeViewId !== viewId && previous && typeof previous.deactivate === 'function') {
          previous.deactivate();
        }

        activeViewId = viewId;
        const current = viewRegistry.get(viewId);
        if (current && typeof current.activate === 'function') current.activate();
      },

      refresh(viewId) {
        const current = viewRegistry.get(viewId || activeViewId);
        if (current && typeof current.refresh === 'function') return current.refresh();
      },

      getActiveId() {
        return activeViewId;
      }
    });
  })();
</script>
